[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os

# Реальный путь к базе всегда берётся динамически из app.shared.config.settings
# (см. migrations/env.py) — то, что ниже, используется только как заглушка,
# если кто-то запустит `alembic` совсem без контекста приложения.
sqlalchemy.url = sqlite:///data/db/expenses.sqlite3

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

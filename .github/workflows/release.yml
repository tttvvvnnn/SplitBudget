name: Release

# Запускается только на пуш тега вида v1.2.3 — то есть релиз происходит осознанно, отдельным
# действием, а не при каждом пуше в main. Порядок: тесты -> сборка+пуш версионного образа в
# GHCR -> релиз на GitHub с changelog -> деплой этой версии на сервер по SSH.
# Как выпустить релиз и что для этого нужно настроить — см. RELEASING.md и DEPLOYMENT.md.
#
# Второй способ запуска — кнопка «Run workflow» (workflow_dispatch) с версией, например 1.3.0:
# workflow сам ставит тег vX.Y.Z на текущий main и дальше идёт тем же путём. Так релиз
# можно запустить и без локального git (в т.ч. Claude из проекта — через GitHub API).
# Тег, запушенный самим workflow, повторно его не запускает (GITHUB_TOKEN не триггерит
# другие запуски), поэтому двойного релиза не будет.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: "Версия без «v», например 1.3.0 (тег vX.Y.Z поставится на main)"
        required: true

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.v.outputs.version }}
      ref: ${{ steps.v.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Версия и тег
        id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -e
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${INPUT_VERSION#v}"
            if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::Версия должна быть вида 1.2.3, а не «$version»"; exit 1
            fi
            if [ "$GITHUB_REF_NAME" != "main" ]; then
              echo "::error::Релиз запускается только с main"; exit 1
            fi
            if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
              echo "::error::Тег v$version уже есть"; exit 1
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "v$version" -m "v$version"
            git push origin "v$version"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "ref=v$version" >> "$GITHUB_OUTPUT"

  test:
    needs: tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag.outputs.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m py_compile $(find app migrations tests -name "*.py")
      - run: pytest -v

  build-and-push:
    needs: [tag, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag.outputs.ref }}

      - name: Compute image name (GHCR требует только строчные буквы)
        id: vars
        run: |
          echo "image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Docker metadata (теги из версии в git tag)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.vars.outputs.image }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.tag.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.tag.outputs.version }}
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  github-release:
    needs: [tag, build-and-push]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag.outputs.ref }}
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          tag_name: ${{ needs.tag.outputs.ref }}
          name: ${{ needs.tag.outputs.ref }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH }}"
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f

[pytest]
# Гарантирует, что `import app...` работает независимо от того, как именно запущен pytest
# (`pytest`, `python -m pytest`, из другого cwd в CI и т.п.).
pythonpath = .
testpaths = tests
filterwarnings =
    # Starlette (фиксируется версией FastAPI) обращается к алиасу, устаревшему в свежем anyio.
    # Это не наш код; уйдёт после обновления FastAPI/Starlette.
    ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning:starlette.testclient
